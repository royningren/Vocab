<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VocabMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        .perspective { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        /* Hide scrollbar for a cleaner mobile app feel */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <div class="max-w-md w-full mx-auto h-full bg-slate-50 shadow-2xl flex flex-col relative">
        
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center z-10">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-brain"></i> VocabMaster
            </h1>
            <div id="connectionStatus" class="text-xs bg-indigo-500 px-2 py-1 rounded-full flex items-center gap-1">
                <div class="w-2 h-2 bg-yellow-300 rounded-full animate-pulse"></div> Connecting...
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto relative" id="mainContent">
            
            <!-- View: Learn -->
            <div id="view-learn" class="view-section h-full flex flex-col p-4 hidden">
                
                <!-- Dashboard: Split UI for New vs Review -->
                <div id="sessionSetup" class="flex-1 flex flex-col gap-5 overflow-y-auto pb-6">
                    
                    <!-- New Words Card -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mb-3">
                            <i class="fa-solid fa-seedling text-3xl"></i>
                        </div>
                        <h2 class="text-xl font-black text-slate-800">New Words</h2>
                        <p class="text-slate-500 text-sm mb-6 font-medium"><span id="newWordsText" class="text-emerald-600 font-bold text-lg">0</span> untouched</p>
                        
                        <div class="w-full mb-6 text-left">
                            <div class="flex justify-between items-center mb-3">
                                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Session Size</label>
                                <span id="maxNewWordsVal" class="font-black text-emerald-600 text-xl">20</span>
                            </div>
                            <input type="range" id="settingMaxNewWords" min="10" max="100" step="10" value="20" class="w-full accent-emerald-500 h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer" oninput="updateNewWordsSlider(this.value)">
                        </div>

                        <button onclick="startNewSession()" id="btnStartNew" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-md transition-transform active:scale-95 disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-play"></i> Start Learning
                        </button>
                    </div>

                    <!-- Review Card -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mb-3">
                            <i class="fa-solid fa-clock-rotate-left text-3xl"></i>
                        </div>
                        <h2 class="text-xl font-black text-slate-800">Review</h2>
                        <p class="text-slate-500 text-sm mb-6 font-medium"><span id="reviewWordsText" class="text-amber-600 font-bold text-lg">0</span> due today</p>
                        
                        <button onclick="startReviewSession()" id="btnStartReview" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl shadow-md transition-transform active:scale-95 disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-left"></i> Start Review
                        </button>
                    </div>

                </div>

                <!-- Flashcard Area (Shared for both modes) -->
                <div id="flashcardArea" class="hidden h-full flex-col">
                    <div class="flex justify-between items-center mb-4 text-sm font-medium text-slate-500">
                        <button onclick="abortAndResetSession()" class="text-slate-400 hover:text-rose-500 transition-colors flex items-center gap-1 pr-2 border-r border-slate-300" title="Quit and revert session progress">
                            <i class="fa-solid fa-arrow-rotate-left"></i> Quit
                        </button>
                        <div class="flex-1 mx-3 bg-slate-200 rounded-full h-2.5 overflow-hidden">
                          <div id="progressBar" class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <span id="progressText" class="min-w-[45px] text-right text-xs font-bold text-slate-600">0/0</span>
                    </div>

                    <div class="flex-1 perspective relative w-full mb-6 cursor-pointer" onclick="flipCard()">
                        <div id="cardInner" class="w-full h-full absolute transform-style-3d card-transition shadow-xl rounded-3xl">
                            <!-- Front -->
                            <div class="absolute w-full h-full bg-white rounded-3xl backface-hidden flex flex-col items-center justify-center p-6 border-2 border-slate-100">
                                <span class="text-sm text-slate-400 absolute top-4 font-medium"><i class="fa-regular fa-hand-pointer mr-1"></i> Tap to flip</span>
                                <h3 id="cardWord" class="text-5xl font-black text-slate-800 text-center break-words">Word</h3>
                            </div>
                            <!-- Back -->
                            <div class="absolute w-full h-full bg-indigo-50 rounded-3xl backface-hidden rotate-y-180 flex flex-col items-center justify-center p-6 border-2 border-indigo-100">
                                <h3 id="cardWordBack" class="text-3xl font-black text-indigo-900 mb-2 text-center">Word</h3>
                                <span id="cardPos" class="text-sm font-bold text-indigo-400 mb-3 italic tracking-wide"></span>
                                <div class="w-12 h-1 bg-indigo-200 mb-5 rounded-full"></div>
                                <p id="cardMeaning" class="text-xl text-slate-700 text-center font-medium leading-relaxed">Meaning</p>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div id="actionButtons" class="grid grid-cols-2 gap-4 mb-2 opacity-50 pointer-events-none transition-opacity">
                        <button onclick="handleAnswer('unknown')" class="bg-rose-100 text-rose-700 hover:bg-rose-200 font-bold py-5 rounded-2xl flex flex-col items-center gap-2 active:scale-95 transition-transform shadow-sm">
                            <i class="fa-solid fa-xmark text-2xl"></i>
                            <span class="text-sm uppercase tracking-wider">Unknown</span>
                        </button>
                        <button onclick="handleAnswer('known')" class="bg-emerald-100 text-emerald-700 hover:bg-emerald-200 font-bold py-5 rounded-2xl flex flex-col items-center gap-2 active:scale-95 transition-transform shadow-sm">
                            <i class="fa-solid fa-check text-2xl"></i>
                            <span class="text-sm uppercase tracking-wider">Known</span>
                        </button>
                    </div>
                </div>
                
                <div id="sessionComplete" class="hidden flex-1 flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-trophy text-7xl text-yellow-400 mb-6 drop-shadow-md"></i>
                    <h2 class="text-3xl font-black text-slate-800 mb-2">Awesome!</h2>
                    <p class="text-slate-500 mb-8 font-medium">You've finished this batch.</p>
                    <button onclick="resetSessionUI()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-10 rounded-full shadow-lg active:scale-95 transition-transform">
                        Back to Dashboard
                    </button>
                </div>
            </div>

            <!-- View: Settings -->
            <div id="view-settings" class="view-section p-6 hidden">
                <h2 class="text-2xl font-black text-slate-800 mb-6 border-b border-slate-200 pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-gear text-slate-400"></i> Settings
                </h2>
                
                <div class="space-y-6">
                    <!-- Library Selection & Stats -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 border-b border-slate-100 pb-2">Library Overview</label>
                        <div class="flex items-center gap-2 mb-5">
                            <select id="settingLibrary" class="flex-1 border-2 border-slate-200 rounded-xl p-3 bg-slate-50 text-sm focus:border-indigo-500 focus:outline-none font-bold text-slate-700" onchange="changeLibrary()">
                                <option value="words">Default</option>
                            </select>
                        </div>
                        
                        <!-- Real-time Stats -->
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 flex flex-col items-center justify-center">
                                <div class="text-3xl font-black text-indigo-600" id="statTotalWords">0</div>
                                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-1">Total Words</div>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 flex flex-col items-center justify-center">
                                <div class="text-3xl font-black text-emerald-500" id="statKnownWords">0</div>
                                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-1">Known (Lvl 1+)</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Nav -->
        <nav class="bg-white border-t border-slate-200 flex pb-safe pt-2 px-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
            <button onclick="switchView('learn')" id="nav-learn" class="nav-btn flex-1 flex flex-col items-center py-2 text-indigo-600 transition-colors">
                <i class="fa-solid fa-book-open text-xl mb-1"></i>
                <span class="text-[11px] font-bold">Learn</span>
            </button>
            <button onclick="switchView('settings')" id="nav-settings" class="nav-btn flex-1 flex flex-col items-center py-2 text-slate-400 hover:text-indigo-500 transition-colors">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[11px] font-bold">Settings</span>
            </button>
        </nav>
    </div>

    <!-- Modal -->
    <div id="customModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl transform scale-95 transition-transform" id="modalContent">
            <h3 class="text-xl font-black text-slate-800 mb-2" id="modalTitle">Notice</h3>
            <p class="text-slate-600 mb-6 text-sm font-medium leading-relaxed" id="modalMessage">Message content</p>
            <button onclick="closeModal()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl active:scale-95 transition-transform">OK</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, updateDoc, writeBatch, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = 'my-vocab-master-app'; 
        
        const firebaseConfig = {
            apiKey: "AIzaSyDijMD-M3JySv_6aXjEEsYWDUY2dwhs7sI",
            authDomain: "vocab-9955e.firebaseapp.com",
            projectId: "vocab-9955e",
            storageBucket: "vocab-9955e.firebasestorage.app",
            messagingSenderId: "116019499855",
            appId: "1:116019499855:web:3bda3acf4c2dcf51c0eb3a",
            measurementId: "G-WEPFETFMV0"
        };

        let app, auth, db, userId;
        
        let allWords = [];
        let sessionWords = [];
        let sessionOriginalStates = [];
        let currentCardIndex = 0;
        let isFlipped = false;
        let unsubscribeSnapshot = null; 
        
        let currentLibrary = 'words';
        let availableLibraries = ['words'];
        let userSettings = {
            maxNewWords: 20,
            currentLibrary: 'words'
        };

        const getLibraryCollection = (lib) => collection(db, 'artifacts', appId, 'public', 'data', lib);
        const getWordDoc = (lib, docId) => doc(db, 'artifacts', appId, 'public', 'data', lib, docId);
        const getMetaDoc = () => doc(db, 'artifacts', appId, 'public', 'data', 'meta_config', 'libraries');

        // UI Helpers
        window.showModal = (title, message) => {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modalContent').classList.remove('scale-95'), 10);
        };
        window.closeModal = () => {
            document.getElementById('customModal').classList.add('hidden');
            document.getElementById('modalContent').classList.add('scale-95');
        };

        window.switchView = (viewName) => {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-indigo-600');
                el.classList.add('text-slate-400');
            });
            document.getElementById(`nav-${viewName}`).classList.add('text-indigo-600');
            document.getElementById(`nav-${viewName}`).classList.remove('text-slate-400');
        };

        window.updateNewWordsSlider = (val) => {
            document.getElementById('maxNewWordsVal').innerText = val;
            userSettings.maxNewWords = parseInt(val);
            localStorage.setItem('vocabMasterSettings', JSON.stringify(userSettings));
        };

        // Core App Initialization
        async function initApp() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);
                userId = auth.currentUser?.uid;

                updateConnectionStatus(true);
                loadSettingsFromLocal();
                setupLibrariesMetaListener();
                setupRealtimeListener(); 
            } catch (error) {
                console.error(error);
                updateConnectionStatus(false);
            }
        }

        function updateConnectionStatus(isConnected) {
            const statusEl = document.getElementById('connectionStatus');
            if (isConnected) {
                statusEl.innerHTML = `<div class="w-2 h-2 bg-emerald-400 rounded-full"></div> Connected`;
                statusEl.classList.replace('bg-indigo-500', 'bg-slate-800');
            } else {
                statusEl.innerHTML = `<div class="w-2 h-2 bg-rose-400 rounded-full"></div> Offline`;
                statusEl.classList.replace('bg-indigo-500', 'bg-rose-600');
            }
        }

        // Library Sync
        function setupLibrariesMetaListener() {
            const metaRef = getMetaDoc();
            onSnapshot(metaRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudList = docSnap.data().list;
                    if (Array.isArray(cloudList)) {
                        availableLibraries = Array.from(new Set(['words', ...cloudList]));
                        
                        if (!availableLibraries.includes(currentLibrary)) {
                            currentLibrary = 'words';
                            userSettings.currentLibrary = 'words';
                            localStorage.setItem('vocabMasterSettings', JSON.stringify(userSettings));
                            setupRealtimeListener();
                        }
                        updateLibrarySelectUI();
                    }
                } else {
                    setDoc(metaRef, { list: availableLibraries }, { merge: true }).catch(console.error);
                }
            }, (err) => console.log("Meta listener error (safe to ignore):", err));
        }

        function updateLibrarySelectUI() {
            const select = document.getElementById('settingLibrary');
            if (!select) return;
            select.innerHTML = '';
            availableLibraries.forEach(lib => {
                const opt = document.createElement('option');
                opt.value = lib;
                opt.innerText = lib === 'words' ? 'Default' : lib;
                select.appendChild(opt);
            });
            select.value = currentLibrary;
        }

        function setupRealtimeListener() {
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
                allWords = []; 
                updateDashboardStats();
            }

            const wordsRef = getLibraryCollection(currentLibrary);
            
            unsubscribeSnapshot = onSnapshot(wordsRef, (snapshot) => {
                allWords = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                updateDashboardStats();
                updateSessionAvailability();
            }, (error) => console.error("Firestore Error:", error));
        }

        function updateDashboardStats() {
            document.getElementById('statTotalWords').innerText = allWords.length;
            const knownCount = allWords.filter(w => (w.level || 0) > 0).length;
            document.getElementById('statKnownWords').innerText = knownCount;
        }

        // --- DASHBOARD LOGIC (New vs Review) ---
        function updateSessionAvailability() {
            const now = Date.now();
            
            // "New Words" are words that have never been reviewed (lastReviewedAt is empty)
            const newWords = allWords.filter(w => !w.lastReviewedAt);
            // "Review Words" are words that were reviewed before AND the midnight deadline has passed
            const reviewWords = allWords.filter(w => w.lastReviewedAt && w.nextReview <= now);
            
            // Update New Words Card
            document.getElementById('newWordsText').innerText = newWords.length;
            const btnNew = document.getElementById('btnStartNew');
            if (newWords.length === 0) {
                btnNew.disabled = true;
                btnNew.innerHTML = `<i class="fa-solid fa-check"></i> All Caught Up`;
            } else {
                btnNew.disabled = false;
                btnNew.innerHTML = `<i class="fa-solid fa-play"></i> Start Learning`;
            }

            // Update Review Card
            document.getElementById('reviewWordsText').innerText = reviewWords.length;
            const btnReview = document.getElementById('btnStartReview');
            if (reviewWords.length === 0) {
                btnReview.disabled = true;
                btnReview.innerHTML = `<i class="fa-solid fa-check"></i> All Reviewed`;
            } else {
                btnReview.disabled = false;
                btnReview.innerHTML = `<i class="fa-solid fa-rotate-left"></i> Start Review`;
            }
        }

        window.startNewSession = () => {
            let newWords = allWords.filter(w => !w.lastReviewedAt);
            // Sort by creation time so you learn older imports first
            newWords.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            
            const maxNew = parseInt(document.getElementById('settingMaxNewWords').value) || 20;
            sessionWords = newWords.slice(0, maxNew);
            
            if (sessionWords.length > 0) initFlashcardInterface();
        };

        window.startReviewSession = () => {
            const now = Date.now();
            let dueWords = allWords.filter(w => w.lastReviewedAt && w.nextReview <= now);
            
            // STRICT SORTING LOGIC:
            // 1. Priority: Known (Level > 0) comes before Unknown (Level 0)
            // 2. Secondary: Chronological order of their previous review time (lastReviewedAt)
            dueWords.sort((a, b) => {
                const isAKnown = (a.level || 0) > 0 ? 1 : 0;
                const isBKnown = (b.level || 0) > 0 ? 1 : 0;
                
                if (isAKnown !== isBKnown) {
                    return isBKnown - isAKnown; // 1 (Known) comes before 0 (Unknown)
                }
                return (a.lastReviewedAt || 0) - (b.lastReviewedAt || 0); // Older review first
            });

            // Review loads all due words for the day
            sessionWords = dueWords; 
            if (sessionWords.length > 0) initFlashcardInterface();
        };

        function initFlashcardInterface() {
            sessionOriginalStates = sessionWords.map(w => ({
                id: w.id,
                status: w.status,
                level: w.level,
                nextReview: w.nextReview,
                lastReviewedAt: w.lastReviewedAt
            }));

            currentCardIndex = 0;
            document.getElementById('sessionSetup').classList.add('hidden');
            document.getElementById('sessionComplete').classList.add('hidden');
            document.getElementById('flashcardArea').classList.remove('hidden');
            document.getElementById('flashcardArea').classList.add('flex');
            
            renderCurrentCard();
        }

        window.abortAndResetSession = async () => {
            if (currentCardIndex === 0) {
                resetSessionUI();
                return;
            }

            if (!confirm("Are you sure you want to quit? Your progress for this specific batch will be undone.")) return;

            try {
                const batch = writeBatch(db);
                for (let i = 0; i < currentCardIndex; i++) {
                    const original = sessionOriginalStates[i];
                    const wordRef = getWordDoc(currentLibrary, original.id);
                    batch.update(wordRef, {
                        status: original.status || 'unknown',
                        level: original.level || 0,
                        nextReview: original.nextReview || Date.now(),
                        lastReviewedAt: original.lastReviewedAt || null
                    });
                }
                await batch.commit();

                const cardInner = document.getElementById('cardInner');
                cardInner.style.transition = 'none'; 
                cardInner.classList.remove('rotate-y-180');
                isFlipped = false;
                requestAnimationFrame(() => cardInner.style.transition = '');

                resetSessionUI();
            } catch (error) {
                console.error("Error resetting session", error);
            }
        };

        window.flipCard = () => {
            if (isFlipped) return; 
            const cardInner = document.getElementById('cardInner');
            cardInner.classList.add('rotate-y-180');
            isFlipped = true;
            document.getElementById('actionButtons').classList.remove('opacity-50', 'pointer-events-none');
        };

        // Get EXACT midnight timestamp of the target day
        function getMidnightOf(daysToAdd) {
            let d = new Date();
            d.setDate(d.getDate() + daysToAdd);
            d.setHours(0, 0, 0, 0); // Sets to 12:00:00 AM strictly
            return d.getTime();
        }

        window.handleAnswer = async (answer) => {
            if (!isFlipped) return;
            
            const sessionWord = sessionWords[currentCardIndex];
            const currentWord = allWords.find(w => w.id === sessionWord.id) || sessionWord;
            
            let newStatus = 'unknown';
            let currentLevel = currentWord.level || 0;
            let nextReviewDateTs;
            
            if (answer === 'unknown') {
                newStatus = 'unknown';
                currentLevel = 0;
                nextReviewDateTs = getMidnightOf(1); // 12:00 AM Tomorrow
            } else if (answer === 'known') {
                newStatus = 'known';
                if (currentLevel === 0) {
                    currentLevel = 1;
                    nextReviewDateTs = getMidnightOf(6); // 12:00 AM on Day 6
                } else if (currentLevel >= 1) {
                    currentLevel = 2;
                    nextReviewDateTs = getMidnightOf(30); // 12:00 AM on Day 30
                }
            }

            document.getElementById('actionButtons').classList.add('opacity-50', 'pointer-events-none');
            
            const wordRef = getWordDoc(currentLibrary, currentWord.id);
            updateDoc(wordRef, {
                status: newStatus,
                level: currentLevel,
                nextReview: nextReviewDateTs,
                lastReviewedAt: Date.now()
            }).catch(e => console.error("Update failed", e)); 

            currentCardIndex++;
            if (currentCardIndex >= sessionWords.length) {
                setTimeout(endSession, 300);
            } else {
                const cardInner = document.getElementById('cardInner');
                cardInner.style.transition = 'none'; 
                cardInner.classList.remove('rotate-y-180');
                isFlipped = false;
                
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        cardInner.style.transition = ''; 
                        renderCurrentCard();
                    });
                });
            }
        };

        function renderCurrentCard() {
            const wordObj = sessionWords[currentCardIndex];
            document.getElementById('cardWord').innerText = wordObj.word;
            document.getElementById('cardWordBack').innerText = wordObj.word;
            document.getElementById('cardPos').innerText = wordObj.pos ? `[${wordObj.pos}]` : '';
            document.getElementById('cardMeaning').innerText = wordObj.meaning;
            
            document.getElementById('progressText').innerText = `${currentCardIndex + 1} / ${sessionWords.length}`;
            const percent = ((currentCardIndex) / sessionWords.length) * 100;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        function endSession() {
            document.getElementById('flashcardArea').classList.add('hidden');
            document.getElementById('flashcardArea').classList.remove('flex');
            document.getElementById('sessionComplete').classList.remove('hidden');
            document.getElementById('progressBar').style.width = `100%`;
            updateSessionAvailability();
        }

        window.resetSessionUI = () => {
            document.getElementById('flashcardArea').classList.add('hidden');
            document.getElementById('flashcardArea').classList.remove('flex');
            document.getElementById('sessionComplete').classList.add('hidden');
            document.getElementById('sessionSetup').classList.remove('hidden');
        };

        window.changeLibrary = () => {
            currentLibrary = document.getElementById('settingLibrary').value;
            userSettings.currentLibrary = currentLibrary;
            localStorage.setItem('vocabMasterSettings', JSON.stringify(userSettings));
            setupRealtimeListener(); 
        };

        function loadSettingsFromLocal() {
            const saved = localStorage.getItem('vocabMasterSettings');
            if (saved) {
                userSettings = JSON.parse(saved);
                
                let safeMax = parseInt(userSettings.maxNewWords) || 20;
                safeMax = Math.min(100, Math.max(10, Math.round(safeMax / 10) * 10));
                
                currentLibrary = userSettings.currentLibrary || 'words';

                document.getElementById('settingMaxNewWords').value = safeMax;
                document.getElementById('maxNewWordsVal').innerText = safeMax;
                
                updateLibrarySelectUI();
            }
        }

        switchView('learn');
        initApp();

    </script>
</body>
</html>
