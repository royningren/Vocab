<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster Data Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            500: '#5A52E5', 
                            100: '#EEF2FF', 
                            50: '#F5F7FF', 
                        },
                        text: {
                            main: '#1F2937',
                            muted: '#6B7280'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8FAFC; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .main-container {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
        }
        .dashed-border {
            border: 2px dashed #A5B4FC; 
        }
        
        /* Custom scrollbar for data area */
        .data-area::-webkit-scrollbar {
            width: 8px;
        }
        .data-area::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .data-area::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .data-area::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-gray-800">

<div class="main-container">
    
    <!-- Header -->
    <header class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-database text-primary-500 text-2xl"></i>
            <h1 class="text-2xl font-bold text-primary-500">VocabMaster Data Center</h1>
        </div>
        <div id="connection-status" class="flex items-center gap-2 bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-sm font-medium">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span>Connecting...</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Panel: Manage & Import -->
        <div class="bg-primary-100 rounded-xl p-6 md:col-span-1">
            <h2 class="text-lg font-semibold text-gray-800 flex items-center gap-2 mb-6">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                Manage & Import
            </h2>

            <div class="mb-5">
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-sm font-medium text-primary-500">Target Library</label>
                    <div class="flex gap-2">
                        <button id="add-lib-btn" class="text-xs bg-white text-primary-600 px-2 py-1 rounded shadow-sm hover:bg-primary-50 transition border border-primary-200"><i class="fa-solid fa-plus"></i> Add</button>
                        <button id="del-lib-btn" class="text-xs bg-white text-red-600 px-2 py-1 rounded shadow-sm hover:bg-red-50 transition border border-red-200"><i class="fa-solid fa-trash"></i> Delete</button>
                    </div>
                </div>
                <div class="relative">
                    <select id="import-library-select" class="w-full appearance-none bg-white border border-gray-300 text-gray-700 py-2.5 px-4 pr-8 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <!-- Options generated by JS -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </div>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-primary-500 mb-2">Upload File (Excel or TXT)</label>
                <div class="bg-white dashed-border rounded-xl p-8 text-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="document.getElementById('file-upload').click()">
                    <i class="fa-solid fa-file-excel text-4xl text-indigo-300 mb-3"></i>
                    <p class="text-sm font-medium text-gray-700">Click to select Excel or TXT file</p>
                    <input type="file" id="file-upload" class="hidden" accept=".xlsx, .xls, .txt">
                </div>
            </div>

            <button id="start-import-btn" class="w-full bg-primary-500 hover:bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors">
                Start Import
            </button>
        </div>

        <!-- Right Panel: View & Export Data -->
        <div class="bg-white border border-gray-200 rounded-xl p-6 md:col-span-2">
            <h2 class="text-lg font-semibold text-gray-800 flex items-center gap-2 mb-6">
                <i class="fa-solid fa-list"></i>
                View & Export Data
            </h2>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-1">Library</label>
                    <div class="relative">
                        <select id="view-library-select" class="w-full appearance-none bg-white border border-gray-300 text-gray-700 py-2 px-3 pr-8 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <!-- Options generated by JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-1">Filter Status</label>
                    <div class="relative">
                        <select id="view-status-select" class="w-full appearance-none bg-white border border-gray-300 text-gray-700 py-2 px-3 pr-8 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="all">Show All Words</option>
                            <option value="new">New Words</option>
                            <option value="known">Known</option>
                            <option value="unknown">Unknown</option>
                            <option value="review">Needs Review</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center mb-2">
                <p class="text-sm font-medium text-gray-600">Showing <span id="word-count" class="text-primary-500 text-lg font-bold">0</span> words</p>
                <button id="export-btn" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 px-3 py-1.5 rounded-md text-sm flex items-center gap-2 transition-colors shadow-sm">
                    <i class="fa-solid fa-file-export text-gray-500"></i> Export List
                </button>
            </div>

            <!-- Data Display Area -->
            <div class="border border-gray-200 rounded-lg h-[400px] flex flex-col data-area overflow-y-auto">
                <div id="data-container" class="flex-1 p-4">
                    <!-- Default Empty State -->
                    <div id="empty-state" class="h-full flex items-center justify-center text-gray-400 font-medium">
                        No data found.
                    </div>
                    
                    <!-- Data List (Hidden by default) -->
                    <ul id="data-list" class="hidden space-y-2">
                        <!-- List items will be injected here via JS -->
                    </ul>
                </div>
            </div>
        </div>
        
    </div>
</div>

<!-- Custom Modal for Notifications -->
<div id="notification-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
        <h3 id="modal-title" class="text-lg font-bold mb-2 text-gray-800">Notification</h3>
        <p id="modal-message" class="text-gray-600 mb-6"></p>
        <div class="flex justify-end">
            <button onclick="closeModal()" class="bg-primary-500 text-white px-4 py-2 rounded font-medium hover:bg-indigo-600">Close</button>
        </div>
    </div>
</div>

<!-- Input Modal for Adding Libraries -->
<div id="input-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
        <h3 class="text-lg font-bold mb-2 text-gray-800">Add New Library</h3>
        <input type="text" id="new-lib-input" placeholder="Library Name" class="w-full bg-white border border-gray-300 text-gray-700 py-2 px-3 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 mb-6">
        <div class="flex justify-end gap-2">
            <button onclick="closeInputModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-medium hover:bg-gray-300">Cancel</button>
            <button id="confirm-add-lib-btn" class="bg-primary-500 text-white px-4 py-2 rounded font-medium hover:bg-indigo-600">Add</button>
        </div>
    </div>
</div>

<!-- Confirm Modal for Deleting Libraries or Words -->
<div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
        <h3 id="confirm-modal-title" class="text-lg font-bold mb-2 text-gray-800">Confirm Deletion</h3>
        <p id="confirm-message" class="text-gray-600 mb-6">Are you sure you want to delete this library?</p>
        <div class="flex justify-end gap-2">
            <button onclick="closeConfirmModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-medium hover:bg-gray-300">Cancel</button>
            <button id="confirm-del-btn" class="bg-red-500 text-white px-4 py-2 rounded font-medium hover:bg-red-600">Delete</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ==========================================
    // 1. YOUR CONFIGURATION HERE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDijMD-M3JySv_6aXjEEsYWDUY2dwhs7sI",
        authDomain: "vocab-9955e.firebaseapp.com",
        projectId: "vocab-9955e",
        storageBucket: "vocab-9955e.firebasestorage.app",
        messagingSenderId: "116019499855",
        appId: "1:116019499855:web:3bda3acf4c2dcf51c0eb3a",
        measurementId: "G-WEPFETFMV0"
    };

    const appId = 'my-vocab-master-app'; 
    
    let db;
    let auth;
    let currentUser = null;
    let useLocalMode = false;
    let libraryList = ['Default', 'Monthly']; 

    // UI Elements
    const statusEl = document.getElementById('connection-status');
    const wordCountEl = document.getElementById('word-count');
    const emptyStateEl = document.getElementById('empty-state');
    const dataListEl = document.getElementById('data-list');
    const viewLibrarySelect = document.getElementById('view-library-select');
    const viewStatusSelect = document.getElementById('view-status-select');
    const importLibrarySelect = document.getElementById('import-library-select');
    const fileUpload = document.getElementById('file-upload');
    const startImportBtn = document.getElementById('start-import-btn');
    const exportBtn = document.getElementById('export-btn');
    const addLibBtn = document.getElementById('add-lib-btn');
    const delLibBtn = document.getElementById('del-lib-btn');
    const confirmAddLibBtn = document.getElementById('confirm-add-lib-btn');
    const confirmDelBtn = document.getElementById('confirm-del-btn');
    const newLibInput = document.getElementById('new-lib-input');

    let currentDisplayedWords = [];
    let deleteType = null; // 'library' or 'word'
    let itemToDeleteId = null;

    window.showModal = (title, message) => {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').textContent = message;
        document.getElementById('notification-modal').classList.remove('hidden');
        document.getElementById('notification-modal').classList.add('flex');
    };

    window.closeModal = () => {
        document.getElementById('notification-modal').classList.add('hidden');
        document.getElementById('notification-modal').classList.remove('flex');
    };

    window.closeInputModal = () => {
        document.getElementById('input-modal').classList.add('hidden');
        document.getElementById('input-modal').classList.remove('flex');
        newLibInput.value = '';
    };

    window.closeConfirmModal = () => {
        document.getElementById('confirm-modal').classList.add('hidden');
        document.getElementById('confirm-modal').classList.remove('flex');
        deleteType = null;
        itemToDeleteId = null;
    };

    async function initFirebase() {
        if (firebaseConfig.apiKey === "YOUR_API_KEY" || !firebaseConfig.apiKey) {
            console.warn("Firebase config not found. Falling back to Local Demo Mode.");
            useLocalMode = true;
            updateStatus('Local Mode Active', true, true);
            await initMetaConfig();
            fetchData(viewLibrarySelect.value || 'Default');
            return;
        }

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            await signInAnonymously(auth);
            currentUser = auth.currentUser;
            
            if (currentUser) {
                updateStatus('Connected to Cloud', true, false);
                await initMetaConfig();
                fetchData(viewLibrarySelect.value || 'Default');
            }

        } catch (error) {
            console.error("Firebase init error:", error);
            updateStatus('Connection Failed', false, false);
        }
    }

    function updateStatus(text, isConnected, isLocal = false) {
        let icon = isConnected ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-triangle-exclamation"></i>';
        if (isLocal) icon = '<i class="fa-solid fa-hard-drive"></i>'; 
        
        statusEl.innerHTML = `${icon}<span>${text}</span>`;
        
        if (isLocal) {
            statusEl.className = `flex items-center gap-2 bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-medium`;
        } else if (isConnected) {
            statusEl.className = `flex items-center gap-2 bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium`;
        } else {
            statusEl.className = `flex items-center gap-2 bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm font-medium`;
        }
    }

    async function initMetaConfig() {
         if (!currentUser || useLocalMode) {
             if (useLocalMode) {
                 const localLibs = localStorage.getItem('vocab_meta_libraries');
                 if (localLibs) libraryList = JSON.parse(localLibs);
                 renderLibrarySelects();
             }
             return;
         }
         try {
             const metaDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'meta_config', 'settings');
             const docSnap = await getDoc(metaDocRef);
             
             if (docSnap.exists() && docSnap.data().libraries) {
                 libraryList = docSnap.data().libraries;
             } else {
                 await setDoc(metaDocRef, { initialized: true, lastUpdated: new Date().toISOString(), libraries: libraryList }, { merge: true });
             }
             renderLibrarySelects();
         } catch(e) {
             console.log("Could not load meta config, using defaults:", e);
             renderLibrarySelects();
         }
    }

    async function saveLibraries() {
        if (useLocalMode) {
            localStorage.setItem('vocab_meta_libraries', JSON.stringify(libraryList));
        } else if (currentUser) {
            try {
                const metaDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'meta_config', 'settings');
                await setDoc(metaDocRef, { libraries: libraryList, lastUpdated: new Date().toISOString() }, { merge: true });
            } catch (error) {
                console.error("Error saving libraries:", error);
            }
        }
    }

    function renderLibrarySelects() {
        const currentView = viewLibrarySelect.value;
        const currentImport = importLibrarySelect.value;
        
        viewLibrarySelect.innerHTML = '';
        importLibrarySelect.innerHTML = '';
        
        libraryList.forEach(lib => {
            viewLibrarySelect.add(new Option(lib, lib));
            importLibrarySelect.add(new Option(lib, lib));
        });

        if (libraryList.includes(currentView)) viewLibrarySelect.value = currentView;
        if (libraryList.includes(currentImport)) importLibrarySelect.value = currentImport;
    }

    async function fetchData(libraryName) {
        if (!libraryName) return;
        emptyStateEl.classList.add('hidden');
        dataListEl.classList.add('hidden');
        dataListEl.innerHTML = '<div class="text-center text-gray-500 py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading data...</div>';
        dataListEl.classList.remove('hidden');
        wordCountEl.textContent = '...';

        if (useLocalMode) {
            setTimeout(() => { 
                const now = new Date();
                let data = JSON.parse(localStorage.getItem(`vocab_${libraryName}`)) || [];
                if (data.length === 0 && libraryName === 'Default') {
                    // Pre-populate with dates guaranteed to trigger the priority review logic
                    const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();
                    const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString();
                    const thirtyOneDaysAgo = new Date(now.getTime() - 31 * 24 * 60 * 60 * 1000).toISOString();
                    const olderDate = new Date(now.getTime() - 40 * 24 * 60 * 60 * 1000).toISOString();
                    
                    data = [
                        { id: crypto.randomUUID(), word: "Resilience", pos: "n.", meaning: "The capacity to withstand or recover quickly from difficulties", status: "known", reviewHistory: [{timestamp: olderDate, status: "unknown"}, {timestamp: sevenDaysAgo, status: "known"}], knownCount: 1 }, // Priority 2
                        { id: crypto.randomUUID(), word: "Ephemeral", pos: "adj.", meaning: "Lasting for a very short time", status: "unknown", reviewHistory: [{timestamp: sevenDaysAgo, status: "known"}, {timestamp: yesterday, status: "unknown"}], knownCount: 0 }, // Priority 3
                        { id: crypto.randomUUID(), word: "Pragmatic", pos: "adj.", meaning: "Dealing with things sensibly and realistically", status: "known", reviewHistory: [{timestamp: olderDate, status: "known"}, {timestamp: thirtyOneDaysAgo, status: "known"}], knownCount: 2 }, // Priority 1
                        { id: crypto.randomUUID(), word: "Serendipity", pos: "n.", meaning: "The occurrence and development of events by chance in a happy or beneficial way", status: "unknown", reviewHistory: [], knownCount: 0 } // New Word
                    ];
                    localStorage.setItem(`vocab_${libraryName}`, JSON.stringify(data));
                }
                renderData(data);
            }, 300);
            return;
        }

        if (!currentUser) return;

        try {
            const wordsCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', libraryName);
            const querySnapshot = await getDocs(wordsCollectionRef);
            
            let words = [];
            querySnapshot.forEach((doc) => {
                // BUG FIX: doc.id MUST be placed AFTER ...doc.data() so it overwrites any fake IDs stored inside the database payload.
                words.push({ ...doc.data(), id: doc.id });
            });

            renderData(words);

        } catch (error) {
            console.error("Error fetching data:", error);
            dataListEl.innerHTML = '';
            emptyStateEl.textContent = "Error loading data. Check console.";
            emptyStateEl.classList.remove('hidden');
            wordCountEl.textContent = '0';
        }
    }

    function renderData(words) {
        const filterStatus = viewStatusSelect.value;
        const now = new Date(); 
        
        // 1. DYNAMICALLY Calculate Review Priorities & Next Review Time
        words.forEach(w => {
            // Extract history if available to set last and prev review dates safely
            const history = w.reviewHistory || [];
            if (history.length > 0) {
                // Ensure it's sorted chronologically
                history.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                w.lastReviewedAt = history[history.length - 1].timestamp;
                w.prevReviewedAt = history.length > 1 ? history[history.length - 2].timestamp : null;
            }

            w.isDue = false;
            w.isNew = !w.lastReviewedAt;
            w.priority = 99; // Default (Not due)
            w.nextRevDate = null; // Store calculated next review date object
            
            if (w.isNew) {
                // Brand new words, never reviewed. Treat separately, do not mark as due for review.
                w.priority = 4; // Display them after due reviews, but before distant future reviews
            } else {
                const lastRev = new Date(w.lastReviewedAt);
                // Backwards compatible for words without knownCount
                const knownCount = w.knownCount !== undefined ? w.knownCount : (w.status === 'known' ? 1 : 0);

                if (w.status === 'unknown') {
                    // Priority 3: Unknown that passed midnight since last review
                    const midnightAfter = new Date(lastRev.getFullYear(), lastRev.getMonth(), lastRev.getDate() + 1);
                    w.nextRevDate = midnightAfter;
                    if (now >= midnightAfter) {
                        w.isDue = true;
                        w.priority = 3;
                    }
                } else if (w.status === 'known') {
                    if (knownCount >= 2) {
                        // Priority 1: Known >= 2 times, passed 30 days at midnight
                        const thirtyDaysLater = new Date(lastRev.getFullYear(), lastRev.getMonth(), lastRev.getDate() + 30);
                        w.nextRevDate = thirtyDaysLater;
                        if (now >= thirtyDaysLater) {
                            w.isDue = true;
                            w.priority = 1;
                        }
                    } else {
                        // Priority 2: Known 1 time, passed 6 days at midnight
                        const sixDaysLater = new Date(lastRev.getFullYear(), lastRev.getMonth(), lastRev.getDate() + 6);
                        w.nextRevDate = sixDaysLater;
                        if (now >= sixDaysLater) {
                            w.isDue = true;
                            w.priority = 2;
                        }
                    }
                }
            }
        });

        // 2. Sort by Priority, then chronologically by previous review time (older first)
        words.sort((a, b) => {
            if (a.priority !== b.priority) {
                return a.priority - b.priority; 
            }
            const timeA = a.lastReviewedAt ? new Date(a.lastReviewedAt).getTime() : 0;
            const timeB = b.lastReviewedAt ? new Date(b.lastReviewedAt).getTime() : 0;
            return timeA - timeB; 
        });
        
        // 3. Filter based on UI selection
        let filteredWords = words;
        if (filterStatus === 'review') {
            filteredWords = words.filter(w => w.isDue);
        } else if (filterStatus === 'new') {
            filteredWords = words.filter(w => w.isNew);
        } else if (filterStatus === 'known') {
            filteredWords = words.filter(w => !w.isNew && w.status === 'known');
        } else if (filterStatus === 'unknown') {
            filteredWords = words.filter(w => !w.isNew && w.status === 'unknown');
        }

        currentDisplayedWords = filteredWords; 
        wordCountEl.textContent = filteredWords.length;

        if (filteredWords.length === 0) {
            dataListEl.innerHTML = '';
            dataListEl.classList.add('hidden');
            emptyStateEl.textContent = "No data found.";
            emptyStateEl.classList.remove('hidden');
            return;
        }

        emptyStateEl.classList.add('hidden');
        dataListEl.classList.remove('hidden');
        dataListEl.innerHTML = '';

        filteredWords.forEach(word => {
            const li = document.createElement('li');
            li.className = 'flex flex-col p-4 border-b border-gray-100 last:border-0 hover:bg-gray-50 rounded transition-colors gap-2';
            
            const wordText = word.word || 'Unknown Word';
            const meaning = word.meaning || 'No definition provided';
            
            let statusLabel, statusText;
            if (word.isNew) {
                statusLabel = 'text-purple-600 bg-purple-100 border border-purple-200';
                statusText = 'New';
            } else if (word.status === 'known') {
                statusLabel = 'text-green-600 bg-green-100 border border-green-200';
                statusText = 'Known';
            } else {
                statusLabel = 'text-blue-600 bg-blue-100 border border-blue-200';
                statusText = 'Unknown';
            }

            const lastRevDate = word.lastReviewedAt ? new Date(word.lastReviewedAt) : null;
            const prevRevDate = word.prevReviewedAt ? new Date(word.prevReviewedAt) : null;
            
            let prevRevStr = "N/A";
            if (prevRevDate) {
                prevRevStr = `${prevRevDate.getMonth()+1}/${prevRevDate.getDate()} ${prevRevDate.getHours().toString().padStart(2,'0')}:${prevRevDate.getMinutes().toString().padStart(2,'0')}`;
            }

            let lastRevStr = "N/A";
            if (lastRevDate) {
                lastRevStr = `${lastRevDate.getMonth()+1}/${lastRevDate.getDate()} ${lastRevDate.getHours().toString().padStart(2,'0')}:${lastRevDate.getMinutes().toString().padStart(2,'0')}`;
            }

            let nextRevStr = "N/A";
            if (word.nextRevDate) {
                const nDate = word.nextRevDate;
                nextRevStr = `${nDate.getMonth()+1}/${nDate.getDate()} ${nDate.getHours().toString().padStart(2,'0')}:${nDate.getMinutes().toString().padStart(2,'0')}`;
            }

            const needsReviewBadge = word.isDue 
                ? `<span class="text-xs px-2 py-0.5 rounded bg-red-50 text-red-600 border border-red-200 font-bold whitespace-nowrap shadow-sm"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Review</span>` 
                : '';
            
            li.innerHTML = `
                <!-- Row 1: Word, Review Badge | Prev Reviewed, Last Reviewed, Next Reviewed, Status -->
                <div class="flex items-center justify-between w-full flex-wrap gap-y-2">
                    <div class="flex items-center gap-2">
                        <span class="text-lg font-bold text-gray-900">${wordText}</span>
                        ${needsReviewBadge}
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <div class="flex items-center justify-end pr-3 border-r border-gray-200 gap-3 overflow-x-auto">
                            <span class="text-[11px] font-medium text-gray-400 whitespace-nowrap" title="Previous Review">
                                <i class="fa-solid fa-clock-rotate-left mr-1"></i>Prev: ${prevRevStr}
                            </span>
                            <span class="text-[11px] font-medium text-gray-500 whitespace-nowrap" title="Last Reviewed">
                                <i class="fa-regular fa-clock mr-1"></i>Last: ${lastRevStr}
                            </span>
                            <span class="text-[11px] font-medium ${word.isDue ? 'text-red-500 font-bold' : 'text-indigo-500'} whitespace-nowrap" title="Next Review">
                                <i class="fa-solid fa-forward-step mr-1"></i>Next: ${nextRevStr}
                            </span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-full ${statusLabel} whitespace-nowrap min-w-[70px] text-center font-bold shadow-sm">${statusText}</span>
                        <button class="delete-word-btn text-gray-400 hover:text-red-500 transition-colors px-1 ml-1" data-id="${word.id}" data-word="${wordText.replace(/"/g, '&quot;')}" title="Delete Word">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
                <!-- Row 2: Part of Speech, Definition -->
                <div class="flex items-start w-full">
                    ${word.pos ? `<span class="text-sm text-indigo-500 font-semibold italic mr-2 shrink-0">${word.pos}</span>` : ''}
                    <span class="text-sm text-gray-600 leading-snug break-words">${meaning}</span>
                </div>
            `;
            dataListEl.appendChild(li);
        });
    }

    viewLibrarySelect.addEventListener('change', (e) => {
        fetchData(e.target.value);
    });

    viewStatusSelect.addEventListener('change', () => {
        fetchData(viewLibrarySelect.value);
    });

    addLibBtn.addEventListener('click', () => {
        document.getElementById('input-modal').classList.remove('hidden');
        document.getElementById('input-modal').classList.add('flex');
        newLibInput.focus();
    });

    confirmAddLibBtn.addEventListener('click', async () => {
        const newLib = newLibInput.value.trim();
        if (!newLib) return;
        if (libraryList.includes(newLib)) {
            window.showModal("Error", "Library already exists.");
            return;
        }
        
        libraryList.push(newLib);
        await saveLibraries();
        renderLibrarySelects();
        window.closeInputModal();
        window.showModal("Success", `Library '${newLib}' added.`);
    });

    dataListEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.delete-word-btn');
        if (btn) {
            deleteType = 'word';
            itemToDeleteId = btn.getAttribute('data-id');
            const wordName = btn.getAttribute('data-word');
            document.getElementById('confirm-modal-title').textContent = "Delete Word";
            document.getElementById('confirm-message').textContent = `Are you sure you want to delete the word '${wordName}'?`;
            document.getElementById('confirm-modal').classList.remove('hidden');
            document.getElementById('confirm-modal').classList.add('flex');
        }
    });

    delLibBtn.addEventListener('click', () => {
        const currentLib = importLibrarySelect.value;
        if (currentLib === 'Default') {
            window.showModal("Error", "Cannot delete the Default library.");
            return;
        }
        deleteType = 'library';
        itemToDeleteId = currentLib;
        document.getElementById('confirm-modal-title').textContent = "Confirm Deletion";
        document.getElementById('confirm-message').textContent = `Are you sure you want to delete the library '${currentLib}'?`;
        document.getElementById('confirm-modal').classList.remove('hidden');
        document.getElementById('confirm-modal').classList.add('flex');
    });

    confirmDelBtn.addEventListener('click', async () => {
        if (!itemToDeleteId) return;
        
        if (deleteType === 'library') {
            libraryList = libraryList.filter(lib => lib !== itemToDeleteId);
            await saveLibraries();
            renderLibrarySelects();
            
            if (useLocalMode) {
                localStorage.removeItem(`vocab_${itemToDeleteId}`);
            }
            
            const deletedLib = itemToDeleteId;
            window.closeConfirmModal();
            window.showModal("Success", `Library '${deletedLib}' deleted.`);
            
            if (viewLibrarySelect.value !== deletedLib) {
                fetchData(viewLibrarySelect.value);
            } else if (libraryList.length > 0) {
                fetchData(libraryList[0]);
            }
        } else if (deleteType === 'word') {
            const currentLibrary = viewLibrarySelect.value;
            try {
                if (useLocalMode) {
                    let data = JSON.parse(localStorage.getItem(`vocab_${currentLibrary}`)) || [];
                    data = data.filter(w => w.id !== itemToDeleteId);
                    localStorage.setItem(`vocab_${currentLibrary}`, JSON.stringify(data));
                } else if (currentUser) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', currentLibrary, itemToDeleteId);
                    await deleteDoc(docRef);
                }
                
                window.closeConfirmModal();
                window.showModal("Success", "Word deleted successfully.");
                fetchData(currentLibrary); 
            } catch (error) {
                console.error("Error deleting word:", error);
                window.closeConfirmModal();
                window.showModal("Error", "Failed to delete word.");
            }
        }
    });

    function setupFileUpload() {
        const fileInput = document.getElementById('file-upload');
        if (!fileInput) return;
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const uploadBox = fileInput.parentElement;
                // BUG FIX: Do not overwrite innerHTML, just update the icon and text to prevent destroying the input element
                uploadBox.querySelector('i').className = 'fa-solid fa-file-circle-check text-4xl text-green-400 mb-3';
                uploadBox.querySelector('p').textContent = file.name;
            }
        });
    }
    
    setupFileUpload();

    startImportBtn.addEventListener('click', async () => {
        if (!currentUser && !useLocalMode) {
            window.showModal("Error", "Not connected to database.");
            return;
        }

        const library = importLibrarySelect.value;
        const fileInput = document.getElementById('file-upload');
        const file = fileInput.files[0];

        if (!library) return;
        if (!file) {
            window.showModal("Error", "Please select a file first.");
            return;
        }
        
        startImportBtn.disabled = true;
        startImportBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Importing...';

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                // Parse Excel file using SheetJS
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                if (rows.length === 0) throw new Error("File is empty");

                // Check if the first row is a header row (e.g., contains 'word')
                let startIdx = 0;
                if (rows[0] && typeof rows[0][0] === 'string' && rows[0][0].toLowerCase().includes('word')) {
                    startIdx = 1;
                }

                let successCount = 0;
                const nowTime = new Date().toISOString();
                let localData = useLocalMode ? (JSON.parse(localStorage.getItem(`vocab_${library}`)) || []) : null;
                const wordsCollectionRef = useLocalMode ? null : collection(db, 'artifacts', appId, 'public', 'data', library);

                for (let i = startIdx; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || !row[0]) continue; // Skip empty rows

                    const wordId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).substring(2);
                    
                    const newWord = {
                        id: wordId,
                        word: String(row[0]).trim(),
                        pos: row[1] ? String(row[1]).trim() : '',
                        meaning: row[2] ? String(row[2]).trim() : '',
                        status: 'unknown',
                        importedAt: nowTime,
                        lastReviewedAt: null,
                        knownCount: 0,
                        reviewHistory: [] // ADDED: Initialize empty history array for new words
                    };

                    if (useLocalMode) {
                        localData.push(newWord);
                    } else {
                        // BUG FIX: Explicitly assign the Document ID so it perfectly matches the payload ID
                        const newDocRef = doc(wordsCollectionRef, wordId);
                        await setDoc(newDocRef, newWord);
                    }
                    successCount++;
                }

                if (useLocalMode) {
                    localStorage.setItem(`vocab_${library}`, JSON.stringify(localData));
                }

                window.showModal("Success", `Import complete. ${successCount} words added to '${library}'.`);
                
                if (viewLibrarySelect.value === library) {
                    fetchData(library);
                }
                
                // Reset file upload UI completely
                fileInput.value = '';
                const uploadBox = fileInput.parentElement;
                uploadBox.querySelector('i').className = 'fa-solid fa-file-excel text-4xl text-indigo-300 mb-3';
                uploadBox.querySelector('p').textContent = 'Click to select Excel or TXT file';

            } catch (error) {
                console.error("Import error:", error);
                window.showModal("Import Failed", "Failed to parse the file. Please ensure it is a valid Excel file with columns: Word, Part of Speech, Meaning.");
            } finally {
                startImportBtn.disabled = false;
                startImportBtn.innerHTML = 'Start Import';
            }
        };
        reader.readAsArrayBuffer(file);
    });

    exportBtn.addEventListener('click', () => {
        if (!currentDisplayedWords || currentDisplayedWords.length === 0) {
            window.showModal("Notice", "No data to export.");
            return;
        }

        // 1. Find the maximum number of reviews across all displayed words
        let maxHistoryLen = 0;
        currentDisplayedWords.forEach(w => {
            if (w.reviewHistory && w.reviewHistory.length > maxHistoryLen) {
                maxHistoryLen = w.reviewHistory.length;
            }
        });

        // 2. Dynamically build the CSV header (Excluding the latest review which is "Last Reviewed")
        const numReviewCols = Math.max(0, maxHistoryLen - 1);
        let csvContent = "\uFEFFWord,Part of Speech,Meaning,Last Reviewed,Status";
        for (let i = 1; i <= numReviewCols; i++) {
            csvContent += `,Review-${i} Time,Review-${i} Status`;
        }
        csvContent += "\n";
        
        currentDisplayedWords.forEach(w => {
            const word = w.word ? w.word.replace(/"/g, '""') : '';
            const pos = w.pos ? w.pos.replace(/"/g, '""') : '';
            const meaning = w.meaning ? w.meaning.replace(/"/g, '""') : '';
            const status = w.isNew ? 'New' : (w.status === 'known' ? 'Known' : 'Unknown');
            
            let lastRev = "Not reviewed";
            if (w.lastReviewedAt) {
                const d = new Date(w.lastReviewedAt);
                lastRev = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            }
            
            let rowStr = `"${word}","${pos}","${meaning}","${lastRev}","${status}"`;
            
            // 3. Generate dynamic Review History Columns (Counting Backwards: N-1, N-2, N-3...)
            const history = w.reviewHistory || [];
            for (let i = 1; i <= numReviewCols; i++) {
                const targetIdx = history.length - 1 - i; // Step backwards from the end
                if (targetIdx >= 0) {
                    const h = history[targetIdx];
                    const hd = new Date(h.timestamp);
                    const timeString = `${hd.getFullYear()}-${(hd.getMonth()+1).toString().padStart(2,'0')}-${hd.getDate().toString().padStart(2,'0')} ${hd.getHours().toString().padStart(2,'0')}:${hd.getMinutes().toString().padStart(2,'0')}`;
                    rowStr += `,"${timeString}","${h.status}"`;
                } else {
                    rowStr += `,"",""`; // Empty columns if this word has no older history
                }
            }

            csvContent += rowStr + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `vocab_export_${new Date().getTime()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    window.addEventListener('DOMContentLoaded', initFirebase);

</script>
